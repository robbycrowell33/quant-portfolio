name: daily-live-run

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC = 1:30pm PT (winter) / 2:30pm PT (summer), after the close
  workflow_dispatch:           # adds a "Run workflow" button in the Actions tab
    inputs:
      force:
        description: "Force a rebalance today"
        type: boolean
        default: false

permissions:
  contents: write              # lets the job commit live/ snapshots back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Live run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python run_live.py ${{ inputs.force && '--force' || '' }}
      - name: Commit snapshots
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add live/
          git diff --cached --quiet || git commit -m "live snapshot $(date -u +%F)"
          git push
